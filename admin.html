<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel · Las Uñas de Cam</title><link rel="stylesheet" href="/styles.css"></head><body class="admin-body"><main class="admin-shell"><div class="admin-top"><a class="brand" href="/"><span>LAS UÑAS</span><b>DE CAM</b></a><a href="/">Ver sitio ↗</a></div><section id="login" class="admin-card"><p class="eyebrow">PANEL PRIVADO</p><h1>Gestioná tus trabajos.</h1><p class="muted">Entrá con tu cuenta para subir, ordenar y eliminar fotos.</p><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Contraseña<input id="password" type="password" required autocomplete="current-password"></label><button class="button" type="submit">Ingresar</button><p id="loginMsg" class="form-msg"></p></form></section><section id="panel" class="hidden"><div class="panel-head"><div><p class="eyebrow">GALERÍA</p><h1>Tus trabajos.</h1></div><button id="logout" class="ghost">Cerrar sesión</button></div><div class="upload"><label class="upload-box"><input id="files" type="file" accept="image/*" multiple><span>＋</span><strong>Agregar fotos</strong><small>Podés seleccionar varias desde el celular.</small></label></div><div id="adminGallery" class="admin-grid"></div><section class="settings"><div><p class="eyebrow">DATOS</p><h2>Información del sitio</h2></div><form id="settingsForm"><label>Instagram<input id="instagram" type="url"></label><label>Teléfono<input id="phone" type="text"></label><label>Ubicación<input id="location" type="text"></label><button class="button" type="submit">Guardar cambios</button><p id="settingsMsg" class="form-msg"></p></form></section></section></main><script type="module" src="/admin.js"></script></body></html>
